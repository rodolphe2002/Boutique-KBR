<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin KBR</title>
  <link rel="stylesheet" href="./adminLogin.css">
  <link rel="icon" type="image/svg+xml" href="../client/img/WhatsApp Image 2025-05-24 à 22.52.58_10ea0336.jpg" />
</head>
<body>
  <h1>Connexion Admin</h1>
  <form id="loginForm">
    <label>Nom d'utilisateur :</label><br>
    <input type="text" id="username" required><br><br>

    <label>Mot de passe :</label><br>
    <input type="password" id="password" required><br><br>

    <button type="submit">Se connecter</button>
  </form>

  <script>
    const baseUrl = window.location.hostname === 'localhost'
      ? 'http://localhost:3000/api'
      : 'https://boutique-kbr.onrender.com/api';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch(`${baseUrl}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const ct = res.headers.get('content-type') || '';
        const payload = ct.includes('application/json') ? await res.json() : { message: await res.text() };
        if (!res.ok) {
          alert(payload.message || `Erreur ${res.status}`);
          return;
        }
        alert(payload.message || 'Connexion réussie');
        localStorage.setItem('adminToken', payload.token);
        window.location.href = './admin.html';
      } catch (err) {
        alert('Erreur réseau lors de la connexion.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
