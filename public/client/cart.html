<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <title>Mon Panier</title>
  <link rel="stylesheet" href="./cart.css"/>
  <link rel="icon" href="./img/WhatsApp Image 2025-05-24 à 22.52.58_10ea0336.jpg" />

  <!-- Google tag -->

<body>

  <!-- 🔹 Barre de navigation -->
  <nav class="navbar">
    <div class="logo"><img src="./img/Logo.jpg" alt="Boutique KBR"></div>
    <ul class="nav-links">
      <li><a href="./index.html">Commander Autre Produit</a></li>

  <main class="main-container">
    <h1 class="cart-title">Votre panier</h1>

    <section id="emptyState" class="empty-cart" style="display:none;">

      <a href="./index.html">Découvrir les produits</a>
    </section>

    <section class="cart-grid" id="cartGrid" style="display:none;">
      <div>
        <div id="cartItems"></div>
        <section id="favorites" class="favorites-block">
          <h2>Favoris</h2>
          <p>Vous voulez voir vos favoris ? <a href="#">Rejoignez-nous</a> ou <a href="#">connectez-vous</a></p>
        </section>
        <section id="recommendations" class="reco-block">
          <h2>Vous aimerez aussi</h2>
          <div id="recoGrid" class="reco-grid"></div>
        </section>
      </div>
      <aside id="cartSummary" class="summary-card"></aside>
    </section>
  </main>

  <script src="cart.js"></script>
